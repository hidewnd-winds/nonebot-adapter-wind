[project]
name = "nonebot-adapter-wind"
version = "0.1.0"
description = "QQ and OneBot V11 extensions with a unified message API for NoneBot2"
readme = "README.md"
requires-python = ">=3.10,<4"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
keywords = ["nonebot", "qq", "onebot", "adapter"]
dependencies = [
    "nonebot2>=2.5.0,<2.6",
    "nonebot-adapter-qq==1.7.3",
    "nonebot-adapter-onebot==2.4.6",
    "pydantic>=2.13.4,<3",
    "typing-extensions>=4.15,<5",
    "aiohttp>=3.12,<4",
    "pillow>=11.3,<13",
]

[project.optional-dependencies]
cos = ["cos-python-sdk-v5>=1.9.38,<2"]

[dependency-groups]
dev = [
    "pytest>=9.1,<10",
    "ruff>=0.14,<1",
    "pyright>=1.1.400,<2",
    "twine>=6,<7",
    "nonebot2[fastapi,httpx,websockets]>=2.5.0,<2.6",
]

[build-system]
requires = ["uv_build>=0.12.19,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "nonebot.adapters.wind"
module-root = ""
source-include = ["docs/**", "examples/**", "tests/**", "CHANGELOG.md", "uv.lock", ".github/workflows/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]

[tool.pyright]
pythonVersion = "3.10"
typeCheckingMode = "basic"
include = ["nonebot/adapters/wind"]
venvPath = "."
venv = ".venv"
